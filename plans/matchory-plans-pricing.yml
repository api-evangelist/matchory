summary: >-
  Matchory publishes a plans page with three named tiers but no prices, no currency, no
  billing period, and no numeric quotas. Every tier carries the identical feature set —
  the published differentiator is scope: "how many sourcing projects you run per year,
  and how many suppliers you actively manage", expressed only as a category-count band.
  Acquisition is via "Get in touch" / "Book a demo"; there is no self-serve checkout and
  no published rate card. Recorded as a contact-sales model rather than omitted, because
  the tier structure itself is real published data.
